<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herkes Kuaför | Giriş</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  height:100vh;
  background:linear-gradient(135deg,#fdfbfb,#ebedee);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CARD */
.login-box{
  background:white;
  width:350px;
  padding:40px;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.login-box h1{
  text-align:center;
  margin-bottom:10px;
}

.login-box p{
  text-align:center;
  color:#666;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:15px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:50px;
  background:black;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#333;
  transform:scale(1.03);
}

.switch{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  cursor:pointer;
  color:#007bff;
}
</style>
</head>

<body>

<div class="login-box">
  <h1 id="title">Giriş Yap</h1>
  <p id="desc">Herkes Kuaför randevu sistemi</p>

  <input type="email" placeholder="E-posta">
  <input type="password" placeholder="Şifre">

  <button onclick="giris()">Devam Et</button>

  <div class="switch" onclick="degistir()">
    Hesabın yok mu? Kayıt Ol
  </div>
</div>

<script>
let girisModu = true;

function degistir(){
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");
  const btn = document.querySelector("button");
  const sw = document.querySelector(".switch");

  if(girisModu){
    title.innerText = "Kayıt Ol";
    desc.innerText = "Yeni hesap oluştur";
    btn.innerText = "Kayıt Ol";
    sw.innerText = "Zaten hesabın var mı? Giriş Yap";
  }else{
    title.innerText = "Giriş Yap";
    desc.innerText = "Herkes Kuaför randevu sistemi";
    btn.innerText = "Devam Et";
    sw.innerText = "Hesabın yok mu? Kayıt Ol";
  }

  girisModu = !girisModu;
}

function giris(){
  alert("Şimdilik sadece ekran 😎\n2. adımda gerçek giriş yapacağız");
  // BURAYA 2. ADIMDA Firebase ekleyeceğiz
}
</script>

</body>
</html>
