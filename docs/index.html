<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herkes Kuaför | Giriş</title>

<!-- Firebase CDN -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgdg5htXKfqHvlC3z1Fcx7v-c0TrXzY1A",
  authDomain: "berber-randevu1.firebaseapp.com",
  projectId: "berber-randevu1",
  storageBucket: "berber-randevu1.firebasestorage.app",
  messagingSenderId: "121530300487",
  appId: "1:121530300487:web:794d76dd009541572a9962"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// GİRİŞ
window.girisYap = function(){
  const email = document.getElementById("email").value;
  const sifre = document.getElementById("sifre").value;

  signInWithEmailAndPassword(auth, email, sifre)
    .then(() => {
      alert("Giriş başarılı 🔥");
      // 2. adımda buradan site.html'ye geçeceğiz
    })
    .catch(err => alert(err.message));
}

// KAYIT
window.kayitOl = function(){
  const email = document.getElementById("email").value;
  const sifre = document.getElementById("sifre").value;

  createUserWithEmailAndPassword(auth, email, sifre)
    .then(() => alert("Kayıt başarılı, şimdi giriş yap"))
    .catch(err => alert(err.message));
}
</script>

<style>
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#fdfbfb,#ebedee);
  font-family:Arial;
}
.box{
  background:white;
  padding:40px;
  width:320px;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}
h2{text-align:center;}
input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
}
button{
  background:black;
  color:white;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
button:hover{background:#333;}
</style>
</head>

<body>

<div class="box">
  <h2>Giriş / Kayıt</h2>
  <input id="email" type="email" placeholder="E-posta">
  <input id="sifre" type="password" placeholder="Şifre (min 6)">
  <button onclick="girisYap()">Giriş Yap</button>
  <button onclick="kayitOl()">Kayıt Ol</button>
</div>

</body>
</html>
